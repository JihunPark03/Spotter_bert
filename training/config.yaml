model:
  id: answerdotai/ModernBERT-large
  max_length: 512

data:
  path: training/data/deepseek_synthetic_reviews.jsonl
  seed: 42
  validation_size: 0.1
  test_size: 0.1
  # Set to a positive integer for a quick smoke test. Null uses all examples.
  max_samples:

dora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  # ModernBERT attention projection layer names. Leave target_modules empty to
  # infer exact module paths from these leaf names.
  target_leaf_modules:
    - Wqkv
    - Wo
  target_modules:
  modules_to_save:
    - classifier

training:
  output_dir: training/outputs/modernbert-large-dora-fake-review-detector
  num_train_epochs: 3
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.06
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  bf16: true
  fp16: false
  logging_steps: 50
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: f1
  greater_is_better: true
  report_to: tensorboard
  run_name: modernbert-large-dora-spotter
